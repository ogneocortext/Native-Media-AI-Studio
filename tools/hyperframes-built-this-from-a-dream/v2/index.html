,{"text":"But I've learned to love the problem, not the doubt","start":48.36,"end":51.24,"section":"intro"},{"text":"My friends ask when it's done, I just laugh and say","start":51.24,"end":54.92,"section":"intro"},{"text":"It's ready when it's ready, not a day","start":54.92,"end":57.8,"section":"intro"},{"text":"So I sit with the mess until it makes sense","start":57.8,"end":61.32,"section":"intro"},{"text":"Trade my weekends for a little more evidence","start":61.32,"end":64.6,"section":"intro"},{"text":"That the thing I see isn't just in my head","start":64.6,"end":68.28,"section":"intro"},{"text":"One more late night, one more thread","start":68.28,"end":71.96000000000001,"section":"intro"},{"text":"(Piece by piece - piece by piece - watch it grow)","start":71.96000000000001,"end":75.28,"section":"intro"},{"text":"(Break it down - break it down - then I know)","start":75.28,"end":78.56,"section":"intro"},{"text":"(Start again - start again - till it's clean)","start":78.56,"end":81.64,"section":"intro"},{"text":"(I built this - built this - from a dream)","start":81.64,"end":97.88,"section":"intro"},{"text":"I've rebuilt the same idea a dozen times","start":97.88,"end":100.75999999999999,"section":"intro"},{"text":"Thrown out the parts that only looked good on paper lines","start":100.75999999999999,"end":103.84,"section":"intro"},{"text":"Nobody claps when something quietly works right","start":103.84,"end":107.08,"section":"intro"},{"text":"But I felt that click at two in the morning light","start":107.08,"end":110.4,"section":"intro"},{"text":"My family thinks I'm just staring at a screen","start":110.4,"end":113.68,"section":"intro"},{"text":"They don't see the little world I'm trying to build between","start":113.68,"end":116.96000000000001,"section":"intro"},{"text":"The failures, and the one time that it holds","start":116.96000000000001,"end":120.88,"section":"intro"},{"text":"That's the part of me that nobody's told","start":120.88,"end":123.56,"section":"intro"},{"text":"So I sit with the mess until it makes sense","start":123.56,"end":127.04,"section":"intro"},{"text":"Trade my weekends for a little more evidence","start":127.04,"end":130.32,"section":"intro"},{"text":"That the thing I see isn't just in my head","start":130.32,"end":134.04,"section":"intro"},{"text":"One more late night, one more thread","start":134.04,"end":137.92000000000002,"section":"intro"},{"text":"(Piece by piece - piece by piece - watch it grow)","start":137.92000000000002,"end":141.0,"section":"intro"},{"text":"(Break it down - break it down - then I know)","start":141.0,"end":144.28,"section":"intro"},{"text":"(Start again - start again - till it's clean)","start":144.28,"end":147.36,"section":"intro"},{"text":"(I built this - built this - from a dream)","start":147.36,"end":151.48,"section":"intro"},{"text":"Maybe it takes a year to make one thing feel true","start":151.48,"end":157.84,"section":"intro"},{"text":"Maybe that's the cost of building something new","start":157.84,"end":163.36,"section":"intro"},{"text":"But when it finally runs the way I always dreamed","start":163.36,"end":170.12,"section":"intro"},{"text":"Every quiet hour will have meant exactly what it seemed","start":170.12,"end":177.24,"section":"intro"},{"text":"(Piece by piece - piece by piece - watch it grow)","start":177.24,"end":180.36,"section":"intro"},{"text":"(Break it down - break it down - then I know)","start":180.36,"end":183.64,"section":"intro"},{"text":"(Start again - start again - till it's clean)","start":183.64,"end":186.68,"section":"intro"},{"text":"(I built this - built this - from a dream)","start":186.68,"end":199.76,"section":"intro"},{"text":"(It finally works, and it was worth it)","start":199.76,"end":212.84,"section":"intro"},{"text":"(It finally works, and it was worth it)","start":212.84,"end":217.84,"section":"intro"}]};

    function getEnergy(t) {

      return ENERGY[Math.max(0, idx)] || 0;
    }
    function getBandFrame(t) {
      const idx = Math.min(Math.floor(t * FPS), BANDS.length - 1);
      return (BANDS[Math.max(0, idx)] && BANDS[Math.max(0, idx)].b) || [0,0,0.2,0.25,0.2,0.15,0.1];
    }
    function nextBeat(t, lookAhead) {
      lookAhead = lookAhead || 0.18;
      for (let i = 0; i < BEATS.length; i++) {
        if (BEATS[i] > t && BEATS[i] - t <= lookAhead) return BEATS[i];
      }
      return null;
    }
    function currentSection(t) {
      let sec = 'intro';
      for (let i = 0; i < LYRICS.length; i++) {
        if (t >= LYRICS[i].start) sec = LYRICS[i].section;
      }
      return sec;
    }
    const SECTION_COLORS = {
      intro:   { orb: 'rgba(180,220,255,0.9)',  ring: 'rgba(140,200,255,0.35)', bar1: 'rgba(60,150,255,0.8)', bar2: 'rgba(140,100,255,0.5)' },
      verse:   { orb: 'rgba(200,240,220,0.9)',  ring: 'rgba(120,220,180,0.35)', bar1: 'rgba(60,200,160,0.8)', bar2: 'rgba(120,200,140,0.5)' },
      drop:    { orb: 'rgba(255,200,180,0.95)', ring: 'rgba(255,140,100,0.4)',  bar1: 'rgba(255,100,80,0.85)',  bar2: 'rgba(255,160,80,0.55)' },
      chorus:  { orb: 'rgba(220,200,255,0.95)', ring: 'rgba(160,120,255,0.4)', bar1: 'rgba(140,100,255,0.85)', bar2: 'rgba(180,120,255,0.55)' },
      final_drop: { orb: 'rgba(255,220,180,0.95)', ring: 'rgba(255,180,100,0.45)', bar1: 'rgba(255,160,60,0.9)', bar2: 'rgba(255,200,100,0.6)' },
      outro:   { orb: 'rgba(180,200,220,0.85)', ring: 'rgba(120,160,200,0.3)', bar1: 'rgba(100,160,220,0.7)', bar2: 'rgba(120,160,200,0.45)' },
    };

    // ─── BUILD LYRIC ELEMENTS ────────────────────────────────────────────────
    const lineEls = [];
    LYRICS.forEach((lyric) => {
      const el = document.createElement('div');
      el.className = 'lyric-line';
      const words = lyric.text.split(' ');
      el.innerHTML = words.map((w, wi) => '<span class="word" data-wi="' + wi + '">' + w + '</span>').join(' ');
      lyricWrap.appendChild(el);
      lineEls.push(el);
    });

    // ─── BUILD SPECTRUM BARS ─────────────────────────────────────────────────
    const BAR_COUNT = 64;
    const barEls = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const b = document.createElement('div');
      b.className = 'bar';
      b.style.height = '3px';
      spectrumEl.appendChild(b);
      barEls.push(b);
    };

    // ─── GSAP TIMELINE ─────────────────────────────────────────────────────
    const tl = gsap.timeline({ repeat: 0, defaults: { ease: 'none' } });
    tl.call(() => {
      // initial state
      sectionLabel.textContent = currentSection(0).toUpperCase().replace('_', ' ');
    });

    // ─── RENDER LOOP (HyperFrames-compatible via timeline onUpdate) ─────────
    let lastFrame = -1;
    function applyFrame(t) {
      const frame = Math.floor(t * FPS);
      if (frame === lastFrame) return;
      lastFrame = frame;

      const energy = getEnergy(t);
      const bands = getBandFrame(t);
      const section = currentSection(t);
      const colors = SECTION_COLORS[section] || SECTION_COLORS.intro;

      // Beat detection
      const beatHit = nextBeat(t, 0.12);

      // Orb pulse
      const scale = 0.85 + energy * 0.55 + (beatHit ? 0.12 : 0);
      orb.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      orb.style.opacity = 0.55 + energy * 0.45;
      orb.style.background = 'radial-gradient(circle at 38% 32%, ' + colors.orb + ', transparent 70%)';

      // Orb ring
      orbRing.style.transform = 'translate(-50%, -50%) scale(' + (0.9 + energy * 0.25) + ')';
      orbRing.style.opacity = 0.35 + energy * 0.45;
      orbRing.style.borderColor = colors.ring;
      orbRing.style.boxShadow = '0 0 30px ' + colors.ring + ', inset 0 0 30px ' + colors.ring;

      // Beat flash
      if (beatHit) {
        flash.style.opacity = 0.7 + energy * 0.3;
        setTimeout(() => { flash.style.opacity = 0; }, 120);
      }

      // Spectrum
      const bandLen = bands.length;
      for (let i = 0; i < BAR_COUNT; i++) {
        const idx = Math.floor((i / BAR_COUNT) * bandLen);
        const val = bands[Math.min(idx, bandLen - 1)] || 0;
        const h = 3 + val * 220;
        barEls[i].style.height = h + 'px';
        barEls[i].style.background = 'linear-gradient(to top, ' + colors.bar1 + ', ' + colors.bar2 + ')';
        barEls[i].style.boxShadow = '0 0 10px ' + colors.bar1;
      }

      // Lyrics
      for (let i = 0; i < LYRICS.length; i++) {
        const lyric = LYRICS[i];
        const active = t >= lyric.start && t <= lyric.end;
        lineEls[i].classList.toggle('active', active);
        if (active) {
          const progress = (t - lyric.start) / (lyric.end - lyric.start);
          const words = lineEls[i].querySelectorAll('.word');
          const wordCount = words.length;
          const litCount = Math.floor(progress * wordCount);
          words.forEach((w, wi) => {
            w.classList.toggle('lit', wi < litCount);
          });
        }
      }

      // Section label
      sectionLabel.textContent = section.toUpperCase().replace('_', ' ');

      // Particles (deterministic)
      ctx.clearRect(0, 0, 1920, 1080);
      const eScale = 0.6 + energy * 1.8;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx * eScale;
        p.y += p.vy * eScale;
        if (p.x < 0) p.x = 1920;
        if (p.x > 1920) p.x = 0;
        if (p.y < 0) p.y = 1080;
        if (p.y > 1080) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.8 + energy * 0.6), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180,220,255,' + (p.alpha * (0.4 + energy * 0.6)) + ')';
        ctx.fill();
      }

      // Waveform ring (center)
      const cx = 960, cy = 540, baseR = 200;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(140,200,255,' + (0.15 + energy * 0.25) + ')';
      ctx.lineWidth = 1.2;
      for (let i = 0; i <= 128; i++) {
        const angle = (i / 128) * Math.PI * 2;
        const bi = Math.floor((i / 128) * bands.length);
        const bv = bands[Math.min(bi, bands.length - 1)] || 0;
        const r = baseR + bv * 50 + Math.sin(angle * 6 + t * 2) * 8;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    tl.to({}, {
      duration: DURATION,
      ease: 'none',
      onUpdate: function() {
        applyFrame(this.time());
      },
    });

    window.__timelines['built-this-from-a-dream'] = tl;
  </script>
