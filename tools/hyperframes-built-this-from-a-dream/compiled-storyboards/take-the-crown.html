<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920, height=1080">
<style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#050510;color:#fff;font-family:Inter,Arial,sans-serif}#root{position:relative;width:1920px;height:1080px;overflow:hidden} .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 16%;opacity:0;transition:opacity 450ms ease;background:linear-gradient(135deg,var(--base),var(--primary))} .scene.active{opacity:1} .eyebrow{font-size:24px;letter-spacing:.16em;text-transform:uppercase;opacity:.75} .title{font-size:82px;margin:24px 0;font-weight:700;max-width:1200px} .description{font-size:30px;max-width:1000px;line-height:1.35;opacity:.9} .progress{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.12)} .progress span{display:block;height:100%;width:0;background:#fff}</style></head><body>
<div id="root" data-hf-id="hf-storyboard-root" data-composition-id="storyboard" data-start="0" data-duration="124.000" data-width="1920" data-height="1080"><div class="progress"><span id="progress"></span></div></div>
<script>const STORYBOARD=[{"id":"intro","title":"The Long Night","description":"Dark ash field, crown far and dim","start":0.0,"end":30.0,"palette":{},"camera":{}},{"id":"drop-1","title":"The First Ignition","description":"Crown pushes in, gold rim ignites","start":30.0,"end":40.5,"palette":{},"camera":{}},{"id":"verse","title":"The Doubt","description":"Crown recedes, intimate glass lyric panel","start":40.5,"end":60.3,"palette":{},"camera":{}},{"id":"build","title":"The Build","description":"Crown spins, gold gradient builds","start":60.3,"end":87.0,"palette":{},"camera":{}},{"id":"drop-2","title":"Take the Crown","description":"Gold flame and kinetic crown reveal","start":87.0,"end":105.5,"palette":{},"camera":{}},{"id":"outro","title":"Arrival","description":"Crown settles into a monument","start":105.5,"end":124.0,"palette":{},"camera":{}}];const duration=124.000;const root=document.getElementById('root');const progress=document.getElementById('progress');for(const [i,scene] of STORYBOARD.entries()){const el=document.createElement('section');el.className='scene';el.id='storyboard-scene-'+i;el.style.setProperty('--base',scene.palette.base||'#050510');el.style.setProperty('--primary',scene.palette.primary||'#263238');el.textContent=scene.title;root.insertBefore(el,progress)}const elements=[...document.querySelectorAll('.scene')];function render(t){progress.style.width=Math.min(100,(t/duration)*100)+'%';let active=0;for(let i=0;i<STORYBOARD.length;i++)if(t>=STORYBOARD[i].start)active=i;elements.forEach((el,i)=>el.classList.toggle('active',i===active))}window.__storyboard=STORYBOARD;window.__renderStoryboard=render;render(0);</script></body></html>
