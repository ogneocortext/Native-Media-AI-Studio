packages:
- packages/frontend
- packages/video-editor
- tools
- '!tools/hyperframes-*'
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  # TypeScript 7 side-by-side (official Microsoft layout, see
  # devblogs.microsoft.com/typescript/announcing-typescript-7-0):
  # `typescript` resolves to @typescript/typescript6 so API consumers
  # (typescript-eslint peer <6.1.0, ts-api-utils, @svgr) keep a stable
  # JS API; `@typescript/native` is typescript@7 and provides the `tsc`
  # binary used by type-check/build scripts.
  typescript: npm:@typescript/typescript6@^6.0.2
  '@typescript/native': npm:typescript@^7.0.2
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  eslint: ^10.15.0
  '@playwright/test': ^1.65.1
  playwright: ^1.65.1
  '@remotion/captions': ^4.0.547
  '@remotion/cli': ^4.0.547
  '@remotion/effects': ^4.0.547
  '@remotion/eslint-config-flat': ^4.0.547
  '@remotion/media': ^4.0.547
  '@remotion/media-utils': ^4.0.547
  '@remotion/noise': ^4.0.547
  '@remotion/renderer': ^4.0.547
  '@remotion/shapes': ^4.0.547
  '@remotion/tailwind-v4': ^4.0.547
  '@remotion/three': ^4.0.547
  '@remotion/transitions': ^4.0.547
  remotion: ^4.0.547
  zod: ^4.6.7
  vite: 8.4.0
  comfyui-mcp: 0.52.206
  '@playwright/mcp': ^0.0.86
  '@tanstack/react-query': ^5.108.4
# ---------------------------------------------------------------------------
# TypeScript runs side-by-side: `typescript` (catalog) is
# @typescript/typescript6 — the JS API that typescript-eslint (<6.1.0
# peer cap), ts-api-utils and @svgr still require — while
# `@typescript/native` is typescript@7 (native Go port, `tsc` bin) used
# by `tsc -b` / `tsc -p` in type-check and build scripts. Do NOT point
# `typescript` at 7.x: TS 7.0 ships no programmatic API and eslint
# crashes at import time. TS 7.1+ may unify this again.
# ---------------------------------------------------------------------------
linkWorkspacePackages: true
preferWorkspacePackages: true
sharedWorkspaceLockfile: true
dedupeDirectDeps: true
optimisticRepeatInstall: true
preferOffline: true
lockfile: true
saveExact: true
saveWorkspaceProtocol: true
catalogMode: strict
catalogPrune: true
auditLevel: high
nodeVersion: 26.13.1
# The runtime pnpm uses for `pnpm run`/`pnpm exec`/`pnpm node` is declared
# via devEngines.runtime in package.json (pnpm 12 removed useNodeVersion;
# without it scripts ran on the ambient fnm node v24 while engines and
# nodeVersion declare 26.13.0 — a real toolchain mismatch).
# 7-day maturity gate (minutes). pnpm 12 defaults to 1440 (1 day); the
# repo's supply-chain posture and the agent dependency rule both prefer
# 7 days. minimumReleaseAgeExclude below lists packages exempted from it.
minimumReleaseAge: 10080
# Enforce dependency `engines` against nodeVersion above. Without this,
# deps declaring incompatible Node versions install silently — the
# engine-strict=true in .npmrc is NOT read by pnpm (it only honors
# registry/auth/TLS/proxy/local-address keys from .npmrc).
engineStrict: true
allowBuilds:
  cloudflared@0.7.3: true
  esbuild: true
overrides:
  typescript-eslint: 8.72.1
  '@remotion/bundler@4.0.547': '>=4.0.547'
  '@remotion/canvas@4.0.547': '>=4.0.547'
