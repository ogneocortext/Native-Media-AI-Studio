# minimumReleaseAgeExclude: version-scoped exemptions for lockfile
# versions younger than the 7-day gate. All prior entries (published
# 2026-11-02..06) aged past the window and were pruned 2026-11-26.
# The 4.0.547 / 5.108.4 / 8.4.0 block below was adopted deliberately
# inside the gate on 2026-11-26 — prune as they age past the window.
