# Known-tolerated peer mismatches (verified 2026-11-06). Each entry is
# scoped to the dependent package so unrelated deps keep honest warnings.
peerDependencyRules:
  allowedVersions:
    # @newkrok/three-particles is unmaintained (wants three ^0.182,
    # strict 0.x caret) but its particle system runs on three 0.186 in
    # the visualizer. three-utils is its transitive dep.
    '@newkrok/three-particles>three': "0.186"
    '@newkrok/three-utils>three': "0.186"
