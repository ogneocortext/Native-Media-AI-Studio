# ---------------------------------------------------------------------------
# TypeScript stays on 5.x: typescript-eslint 8.x (the lint toolchain)
# peer-caps typescript at >=4.8.4 <6.1.0 AND hard-fails at import time on
# TS 7 ("typescript-eslint does not support TS 7.0" — verified live), so
# neither TS 6 nor the TS 7 native port can be adopted until
# typescript-eslint ships support. The `typescript` catalog entry above
# is the single source of truth; do not bump it past 5.x.
# ---------------------------------------------------------------------------
linkWorkspacePackages: true
preferWorkspacePackages: true
sharedWorkspaceLockfile: true
dedupeDirectDeps: true
optimisticRepeatInstall: true
preferOffline: true
lockfile: true
saveExact: true
saveWorkspaceProtocol: true
catalogMode: strict
catalogPrune: true
auditLevel: high
nodeVersion: 26.13.0
# The runtime pnpm uses for `pnpm run`/`pnpm exec`/`pnpm node` is declared
# via devEngines.runtime in package.json (pnpm 12 removed useNodeVersion;
# without it scripts ran on the ambient fnm node v24 while engines and
# nodeVersion declare 26.13.0 — a real toolchain mismatch).
# 7-day maturity gate (minutes). pnpm 12 defaults to 1440 (1 day); the
# repo's supply-chain posture and the agent dependency rule both prefer
# 7 days. minimumReleaseAgeExclude below lists packages exempted from it.
minimumReleaseAge: 10080
# Enforce dependency `engines` against nodeVersion above. Without this,
# deps declaring incompatible Node versions install silently — the
# engine-strict=true in .npmrc is NOT read by pnpm (it only honors
# registry/auth/TLS/proxy/local-address keys from .npmrc).
engineStrict: true
allowBuilds:
  cloudflared@0.7.3: true
  esbuild: true
