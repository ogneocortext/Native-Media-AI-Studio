[project]
name = "native-media-ai-studio"
version = "1.0.0"
description = "AI-powered media generation studio with image, video, and audio capabilities"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20",
    "aiohttp>=3.13.5",
    "psutil>=7.2.2",
    "python-socketio>=5.16.1",
    "Pillow>=12.2.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "websockets>=17.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
    "gpustat>=1.1.1",
    "nvidia-ml-py>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pyright]
include = ["packages/backend/app"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.git",
    "third_party",
    "venv",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["third_party", "runtime"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["third_party", "runtime", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
