[project]
name = "native-media-ai-studio"
version = "1.0.0"
description = "AI-powered media generation studio with image, video, and audio capabilities"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20",
    "aiohttp>=3.13.5",
    "psutil>=7.2.2",
    "python-socketio>=5.16.1",
    "Pillow>=12.2.0",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "websockets>=17.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=3.5.0",
    "gpustat>=1.1.1",
    "nvidia-ml-py>=13.615.71",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.26.0",
    "openai>=1.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pyright]
include = ["packages/backend/app"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.git",
    "third_party",
    "venv",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["third_party", "runtime"]

[tool.ruff]
# Pin ruff version to avoid surprise breakage from default-rule changes
# (ruff v0.16+ enabled 413 rules by default, up from 59).
required-version = ">=0.14.0,<0.18.0"
line-length = 100
target-version = "py311"
exclude = ["third_party", "runtime", "node_modules"]

[tool.ruff.lint]
# Use `extend-select` to add to Ruff's curated defaults rather than
# replacing them wholesale with `select`. Categories below are measured
# against this tree — see ignore list for deliberate exclusions.
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    # --- added after measuring each family against this tree ---
    # "D" (pydocstyle) was evaluated and REJECTED: enabling it surfaces
    # 382 pre-existing docstring issues across the backend API layer
    # (missing argument descriptions, blank-line-after-summary,
    # undocumented public classes, etc.). The project has no pydocstyle
    # tradition and enforcing it would block development. Keep FBT/FURB/
    # TC003 instead — they're targeted, valuable, and don't create churn.
    "ERA",    # eradicate: commented-out code
    "FBT",    # flake8-boolean-trap: no boolean positional args (AI-friendly)
    "FURB",   # refurb: modern idioms (all auto-fixable)
    "PIE",    # misc: unnecessary `pass`, `startswith` against a tuple
    "RSE",    # flake8-raise: needless parens on raised exceptions
    "RUF012", # mutable class-attribute default (real aliasing bug class)
    "TCH",    # type-checking imports: don't import heavy modules at runtime
]
# Ignored deliberately, each measured rather than assumed:
#   DTZ - naive datetime. 66 sites, mostly `datetime.now()` as a local wall-clock
#        stamp in database.py. Real, but a timezone-migration project, not a lint.
#   SIM/RET/PERF - 100+ hits each of pure style churn.
#   ARG/PL/TRY/COM/D/TID/EM/G/BLE - hundreds each; that noise buries real bugs.
#   T201 - `print` is legitimate in the gen3d CLI scripts.
#   RUF002/RUF003 - ambiguous-unicode. This codebase deliberately writes en
#        dashes and multiplication signs in prose comments; flagging them is
#        churn against an intentional house style, not a defect.
ignore = ["E501", "N999"]  # Line too long (handled by formatter); N999 invalid module name on hyphenated tool script names (intentional CLI naming)

# Allow `--fix` to correct every enabled rule; mark the few we never want
# auto-fixed as unfixable.
fixable = ["ALL"]
unfixable = ["B"]  # flake8-bugbear: prefer human review for bug-prone patterns

# Opt into newer rules and formatter changes as they land.
preview = true

[tool.ruff.lint.per-file-ignores]
# Test suites inject the backend root into sys.path before importing `app.*`,
# which necessarily places those imports after executable statements.
"packages/backend/tests/**" = ["E402"]
# Windows API constants in the process-enumeration helper mirror the Win32
# names verbatim (TH32CS_SNAPPROCESS, PROCESSENTRY32, ...) for greppability.
"packages/backend/app/diagnostics/resources.py" = ["N806"]
# Tools scripts use hyphenated names (e.g. check-docs-map.py) for CLI
# discoverability; they are not importable modules, so N999 does not apply.
"tools/**" = ["N999"]
# __init__.py files are package markers; module-import-not-at-top-of-file
# doesn't apply there.
"**/__init__.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Starlette inspect these callables inside argument defaults —
# File(...)/Query(...)/Depends(...)/Path(...)/Header(...) are the supported idiom.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Form",
]

[tool.ruff.lint.flake8-boolean-trap]
# AI agents love passing bare booleans; force named arguments or enums instead.
extend-allowed-calls = []

[tool.ruff.lint.isort]
# Known modules for the Native Media AI Studio codebase — helps AI agents
# place imports in the right section instead of defaulting to third_party.
known-first-party = ["app", "tools"]
known-third-party = ["fastapi", "uvicorn", "pydantic", "librosa", "soundfile", "websockets", "numpy", "httpx", "python-dotenv", "sse-starlette", "gpustat", "nvidia-ml-py", "pytest", "mypy", "ruff"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# Test discovery
testpaths = ["packages/backend/tests"]
pythonpath = ["packages/backend"]

# Strictness — catches AI agent mistakes early (unknown markers, bad config)
strict_markers = true
strict_config = true

# Async support (pytest-asyncio auto mode — no @pytest.mark.asyncio needed)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Default options: short tracebacks, quiet, show 10 slowest tests
addopts = ["--tb=short", "-q", "--durations=10"]

# Global timeout — prevents AI-generated tests from hanging indefinitely.
# Requires pytest-timeout plugin (listed in [project.optional-dependencies] dev).
timeout = 120
timeout_method = "thread"

# Register custom markers so --strict-markers doesn't reject them.
markers = [
    "asyncio: mark test as async (auto-applied by pytest-asyncio in auto mode)",
    "slow: slow-running tests; exclude with -m 'not slow'",
    "integration: cross-component integration tests",
    "network: tests requiring network access",
    "gpu: GPU-specific tests",
]

# Turn common warning categories into errors — catches AI-generated test
# issues like deprecated APIs and resource leaks early.
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "default::ResourceWarning",
]
